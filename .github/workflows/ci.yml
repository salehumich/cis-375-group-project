name: CI
on: [pull_request]
jobs:
    check-code:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '26'
                cache: 'npm'
                cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run test
            - run: npm run build
            